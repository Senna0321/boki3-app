<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <pattern id="stripes" width="1600" height="96" patternUnits="userSpaceOnUse">
    <rect width="1600" height="48" fill="#ffffff"/>
    <rect y="48" width="1600" height="48" fill="#eaf8f0"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#789" flood-opacity=".12"/>
  </filter>
</defs>
<rect width="1600" height="1000" fill="url(#stripes)"/>
<g opacity=".62" stroke="#91b9a5" stroke-width="4" fill="#f9fffb" stroke-linejoin="round" filter="url(#soft)">
  <!-- calculator -->
  <g transform="translate(65 70) rotate(-8)">
    <rect width="180" height="240" rx="22"/>
    <rect x="22" y="22" width="136" height="54" rx="10" fill="#dff3e7"/>
    <g fill="#eaf8f0">
      <rect x="22" y="94" width="28" height="28" rx="6"/><rect x="61" y="94" width="28" height="28" rx="6"/><rect x="100" y="94" width="28" height="28" rx="6"/><rect x="139" y="94" width="19" height="28" rx="6"/>
      <rect x="22" y="133" width="28" height="28" rx="6"/><rect x="61" y="133" width="28" height="28" rx="6"/><rect x="100" y="133" width="28" height="28" rx="6"/><rect x="139" y="133" width="19" height="28" rx="6"/>
      <rect x="22" y="172" width="28" height="28" rx="6"/><rect x="61" y="172" width="28" height="28" rx="6"/><rect x="100" y="172" width="28" height="28" rx="6"/><rect x="139" y="172" width="19" height="28" rx="6"/>
    </g>
  </g>
  <!-- notebook -->
  <g transform="translate(1330 75) rotate(8)">
    <rect width="190" height="220" rx="14"/>
    <line x1="28" y1="48" x2="160" y2="48"/><line x1="28" y1="82" x2="160" y2="82"/><line x1="28" y1="116" x2="160" y2="116"/><line x1="28" y1="150" x2="160" y2="150"/>
    <text x="95" y="30" text-anchor="middle" font-size="18" fill="#5d9e7e" stroke="none" font-family="sans-serif">仕訳帳</text>
  </g>
  <!-- ledger bottom left -->
  <g transform="translate(55 750) rotate(5)">
    <rect width="300" height="165" rx="15"/>
    <line x1="30" y1="42" x2="270" y2="42"/><line x1="30" y1="82" x2="270" y2="82"/><line x1="30" y1="122" x2="270" y2="122"/>
    <line x1="110" y1="20" x2="110" y2="145"/><line x1="205" y1="20" x2="205" y2="145"/>
    <text x="150" y="28" text-anchor="middle" font-size="17" fill="#5d9e7e" stroke="none" font-family="sans-serif">総勘定元帳</text>
  </g>
  <!-- balance sheet bottom right -->
  <g transform="translate(1270 760) rotate(-6)">
    <rect width="270" height="175" rx="14"/>
    <line x1="25" y1="45" x2="245" y2="45"/><line x1="135" y1="45" x2="135" y2="150"/>
    <line x1="25" y1="85" x2="245" y2="85"/><line x1="25" y1="120" x2="245" y2="120"/>
    <text x="135" y="31" text-anchor="middle" font-size="16" fill="#5d9e7e" stroke="none" font-family="sans-serif">貸借対照表</text>
  </g>
  <!-- pen -->
  <g transform="translate(1170 310) rotate(28)">
    <rect width="230" height="26" rx="13" fill="#b7e1ca"/>
    <polygon points="230,0 275,13 230,26" fill="#eef9f2"/>
    <rect x="42" y="0" width="15" height="26" fill="#8fc7a7" stroke="none"/>
  </g>
  <!-- receipt -->
  <g transform="translate(110 390) rotate(-7)">
    <path d="M0 0 h220 v160 l-20-12-20 12-20-12-20 12-20-12-20 12-20-12-20 12-20-12-20 12-20-12-20 12Z"/>
    <text x="110" y="35" text-anchor="middle" font-size="18" fill="#5d9e7e" stroke="none" font-family="sans-serif">領収書</text>
    <line x1="25" y1="60" x2="195" y2="60"/><line x1="25" y1="92" x2="170" y2="92"/><line x1="25" y1="124" x2="185" y2="124"/>
  </g>
</g>
<g opacity=".55" fill="#b7e1ca">
  <circle cx="390" cy="120" r="8"/><circle cx="1190" cy="140" r="7"/><circle cx="430" cy="870" r="8"/><circle cx="1180" cy="860" r="9"/>
</g>
</svg>